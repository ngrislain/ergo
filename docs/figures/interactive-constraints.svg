<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">Rigid-group editing and constrained dynamic dragging</title><desc id="desc">A fixed-connected group moves as one only if its path avoids obstacles. A revolute joint keeps an anchor and axis while allowing rotation. Dynamic dragging uses a bounded spring drive, so contacts and joints may prevent reaching the target.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#56768b"/></marker></defs>
  <rect width="1040" height="430" rx="14" fill="#f5f9fc"/>
  <g font-family="Arial,sans-serif" fill="#263e50"><text x="28" y="41" font-size="21" font-weight="bold">The target is a request, not permission to break constraints.</text>
    <g stroke="#b7cbd8" fill="white"><rect x="29" y="83" width="306" height="290" rx="9"/><rect x="367" y="83" width="306" height="290" rx="9"/><rect x="705" y="83" width="306" height="290" rx="9"/></g>
    <g font-size="16" font-weight="bold"><text x="48" y="116">Rigid connected edit</text><text x="386" y="116">Revolute joint</text><text x="724" y="116">Dynamic pull</text></g>
    <g transform="translate(51 157)"><g stroke="#6d959f" fill="#8ab7bd"><rect x="0" y="56" width="84" height="40"/><rect x="21" y="14" width="84" height="40"/></g><path d="M42 43V70" stroke="#a57a30" stroke-width="4"/><path d="M120 62H188" stroke="#56768b" stroke-width="2" marker-end="url(#a)"/><path d="M209 -2V112H243V-2" fill="#e0b4a4" stroke="#be8d7d"/><rect x="112" y="14" width="84" height="82" fill="none" stroke="#8da9ba" stroke-dasharray="5 4"/></g>
    <text x="48" y="306" font-size="13">Traverse fixed edges.</text><text x="48" y="329" font-size="13">Move all members together.</text><text x="48" y="352" font-size="12" fill="#607f94">Reject a blocked or articulated move.</text>
    <g transform="translate(403 149)"><rect x="2" y="42" width="65" height="66" fill="#8baabc"/><path d="M42 75H195" stroke="#56768b" stroke-width="3" stroke-dasharray="4 4"/><ellipse cx="151" cy="75" rx="34" ry="58" fill="#edc77c" stroke="#bb944b" stroke-width="2"/><ellipse cx="151" cy="75" rx="10" ry="17" fill="white" stroke="#bb944b"/><path d="M188 37C218 51 219 96 189 112" fill="none" stroke="#56768b" stroke-width="2" marker-end="url(#a)"/></g>
    <text x="386" y="306" font-size="13">Anchors coincide; axes align.</text><text x="386" y="329" font-size="13">One angular freedom remains.</text><text x="386" y="352" font-size="12" fill="#607f94">Optional angle and motor limits.</text>
    <g transform="translate(730 157)"><rect x="0" y="42" width="70" height="51" fill="#8ab7bd" stroke="#6d959f"/><path d="M70 66L82 51L94 81L106 51L118 81L130 66H163" stroke="#ba8c3b" stroke-width="2" fill="none"/><path d="M198 0V126" stroke="#bc9b8e" stroke-width="17"/><circle cx="239" cy="66" r="9" fill="none" stroke="#56768b" stroke-width="2"/><path d="M229 66H249M239 56V76" stroke="#56768b"/></g>
    <text x="724" y="306" font-size="13">Drive a dynamic body with force.</text><text x="724" y="329" font-size="13">The solver preserves constraints.</text><text x="724" y="352" font-size="12" fill="#607f94">A wall can make a target unreachable.</text>
    <text x="30" y="405" font-size="13" fill="#607f94">Complete mechanical island → solve in the working copy → settle → server validation → new immutable snapshot</text>
  </g>
</svg>
