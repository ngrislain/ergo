<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-labelledby="title desc">
  <title id="title">Geographic 2D cells, 3D layers, and immutable persistence</title><desc id="desc">Paris is the origin of a geographic cell grid. Each cell spans one arc-second east and north, and is 1024 brick units on each construction axis. Vertical layers are independent of GPS. A manifest references hashed geometry and block objects.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6c8799"/></marker></defs>
  <rect width="1040" height="440" rx="14" fill="#f5f9fc"/>
  <g font-family="Arial,sans-serif" fill="#263e50"><text x="28" y="39" font-size="21" font-weight="bold">Geographic address, vertical layer, immutable content</text>
    <text x="30" y="80" font-size="16" font-weight="bold">2D location</text><text x="379" y="80" font-size="16" font-weight="bold">3D storage cell</text><text x="702" y="80" font-size="16" font-weight="bold">Published snapshot</text>
    <g transform="translate(58 108)" stroke="#a5bfce" fill="white"><rect width="224" height="210"/><path d="M56 0V210M112 0V210M168 0V210M0 52.5H224M0 105H224M0 157.5H224"/><rect x="112" y="52.5" width="56" height="52.5" fill="#f5d38b"/><circle cx="112" cy="105" r="5" fill="#365c75"/><path d="M-17 206V5M0 228H220" stroke="#6c8799" marker-end="url(#a)"/></g>
    <text x="177" y="199" font-size="12">(0, 0)</text><text x="66" y="241" font-size="13">Paris origin</text><text x="58" y="367" font-size="12" fill="#607f94">Longitude east: 1 arc-second / cell</text><text x="58" y="388" font-size="12" fill="#607f94">Latitude north: 1 arc-second / cell</text>
    <g transform="translate(391 131)" stroke="#8faebe" stroke-width="1.5"><path d="M0 60L100 2L218 67L116 126Z" fill="#dfeef2"/><path d="M0 60V179L116 242V126Z" fill="#eaf3f7"/><path d="M116 126V242L218 183V67Z" fill="#c9e0e8"/><path d="M0 120L116 183L218 126M0 179L100 121L218 183" fill="none" stroke-dasharray="4 4"/><path d="M-17 176V39" stroke="#6c8799" marker-end="url(#a)"/></g>
    <text x="370" y="165" font-size="12">Z up</text><text x="399" y="401" font-size="13">1024 × 1024 × 1024 brick units</text><text x="423" y="423" font-size="12" fill="#607f94">Z height; global floor at zero</text>
    <g stroke="#b6cbd8" fill="white"><rect x="705" y="109" width="292" height="73" rx="7"/><rect x="705" y="225" width="137" height="82" rx="7"/><rect x="862" y="225" width="137" height="82" rx="7"/></g>
    <text x="726" y="138" font-size="15" font-weight="bold">Owner / world / manifest.json</text><text x="726" y="162" font-size="12" fill="#607f94">Cells, geometry, constraints, validation</text>
    <g stroke="#6c8799" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M779 185V216"/><path d="M927 185V216"/></g>
    <text x="723" y="252" font-size="14" font-weight="bold">Block objects</text><text x="723" y="275" font-size="12" fill="#607f94">SHA-256.cbor</text><text x="723" y="293" font-size="12" fill="#607f94">Brick instances</text><text x="879" y="252" font-size="14" font-weight="bold">Part meshes</text><text x="879" y="275" font-size="12" fill="#607f94">SHA-256.cbor</text><text x="879" y="293" font-size="12" fill="#607f94">Shared geometry</text>
    <text x="706" y="354" font-size="13">Upload all objects first.</text><text x="706" y="376" font-size="13">Publish the manifest last.</text><text x="706" y="405" font-size="12" fill="#607f94">A storage boundary is not a mechanical joint.</text>
  </g>
</svg>
