<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="350" viewBox="0 0 1040 350" role="img" aria-labelledby="title desc">
  <title id="title">Rounded standard-colour baseplate regions</title><desc id="desc">A visible 128-stud cell checks its cache. A basic OpenStreetMap vector style retains natural features, roads and landmark names without commercial POIs. A 65 by 65 palette field supplies categorical weights; each stud chooses one exact swatch, with rounded region borders and no RGB gradient. Shared cell edges agree and the body remains below Z zero.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#688397"/></marker></defs>
  <rect width="1040" height="350" rx="12" fill="#f5f9fc"/>
  <defs><pattern id="terrain" patternUnits="objectBoundingBox" width="1" height="1" viewBox="0 0 100 100" preserveAspectRatio="none"><rect width="100" height="100" fill="#00852b"/><path d="M0 0H30C22 24 63 28 40 52S13 75 25 100H0Z" fill="#1e5aa8"/><path d="M50 100C40 72 79 72 100 45V100Z" fill="#969696"/><circle cx="93" cy="95" r="23" fill="#d7ba8c"/></pattern></defs>
  <g font-family="Arial,sans-serif" fill="#263e50"><text x="28" y="38" font-size="21" font-weight="bold">Rounded colour borders, one standard LEGO swatch per stud.</text>
    <g fill="white" stroke="#b8cdd9"><rect x="28" y="78" width="213" height="180" rx="7"/><rect x="285" y="78" width="213" height="180" rx="7"/><rect x="542" y="78" width="213" height="180" rx="7"/><rect x="799" y="78" width="213" height="180" rx="7"/></g>
    <g font-size="15" font-weight="bold"><text x="46" y="106">Visible cell / cache miss</text><text x="304" y="106">Style OSM features</text><text x="560" y="106">Sample exact swatches</text><text x="817" y="106">One special plate</text></g>
    <g transform="translate(66 130)" stroke="#97b3c5" fill="#edf4f8"><rect width="136" height="83"/><path d="M45 0V83M90 0V83M0 28H136M0 55H136"/><rect x="45" y="28" width="45" height="27" fill="#f1ce83"/></g>
    <g transform="translate(324 131)"><path d="M0 0H136V82H0Z" fill="#c4c6ad"/><path d="M0 35H136M51 0V82" stroke="#f6f3e9" stroke-width="14"/><g fill="#6e9892"><rect x="6" y="4" width="30" height="20"/><rect x="84" y="52" width="43" height="23"/></g><g fill="#526e81"><circle cx="17" cy="17" r="2"/><circle cx="68" cy="17" r="2"/><circle cx="119" cy="17" r="2"/><circle cx="17" cy="65" r="2"/><circle cx="68" cy="65" r="2"/><circle cx="119" cy="65" r="2"/></g></g>
    <rect x="591" y="137" width="110" height="71" rx="4" fill="url(#terrain)"/><text x="558" y="237" font-size="12" fill="#607f94">65² samples · 2-stud spacing</text>
    <g transform="translate(825 141)"><path d="M0 36L69 0L160 39L91 76Z" fill="url(#terrain)" stroke="#b49c72"/><path d="M0 36V45L91 85V76ZM91 76V85L160 48V39Z" fill="#bba77e"/><g stroke="#607f94"><ellipse cx="36" cy="34" rx="6" ry="3.5" fill="#1e5aa8"/><ellipse cx="67" cy="20" rx="6" ry="3.5" fill="#00852b"/><ellipse cx="97" cy="33" rx="6" ry="3.5" fill="#969696"/><ellipse cx="128" cy="46" rx="6" ry="3.5" fill="#d7ba8c"/><ellipse cx="66" cy="48" rx="6" ry="3.5" fill="#00852b"/><ellipse cx="96" cy="61" rx="6" ry="3.5" fill="#969696"/></g><path d="M0 25L69 -11L160 28" stroke="#7494a8" stroke-dasharray="4 3" fill="none"/></g>
    <text x="45" y="238" font-size="12" fill="#607f94">No world-wide pre-generation</text><text x="304" y="238" font-size="12" fill="#607f94">No commercial POI labels</text><text x="818" y="249" font-size="12" fill="#607f94">128² studs · 384-plate cell</text>
    <g stroke="#688397" stroke-width="2" marker-end="url(#a)"><path d="M247 166H277"/><path d="M504 166H534"/><path d="M761 166H791"/></g>
    <text x="29" y="309" font-size="13" fill="#607f94">Reuse saved cells. Preserve source attribution. Ground generation is asset work; 3D drawing and physics stay on the client.</text>
  </g>
</svg>
