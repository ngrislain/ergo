<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">Reproducible solidity tests in physical units</title><desc id="desc">A horizontal waveform moves a construction's baseplate. A box with specified mass and dimensions falls from a specified height. Both cases report motion, breakage, settling, and missing calibration rather than a universal strength claim.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5e7d91"/></marker></defs>
  <rect width="1040" height="430" rx="14" fill="#f5f9fc"/>
  <g font-family="Arial,sans-serif" fill="#263e50"><text x="28" y="40" font-size="21" font-weight="bold">Test a declared disturbance, with traceable physical inputs.</text>
    <g fill="white" stroke="#b6cbd8"><rect x="29" y="82" width="475" height="278" rx="9"/><rect x="536" y="82" width="475" height="278" rx="9"/></g>
    <text x="49" y="114" font-size="17" font-weight="bold">Controlled baseplate shake</text><text x="556" y="114" font-size="17" font-weight="bold">Dropped test box</text>
    <g transform="translate(64 151)" stroke="#7398a7" fill="#91b8be"><rect x="45" y="71" width="110" height="30"/><rect x="57" y="39" width="86" height="30"/><rect x="69" y="7" width="62" height="30"/><rect x="5" y="105" width="190" height="13" fill="#d2dfe6"/><path d="M0 143H200" fill="none" stroke="#5e7d91" marker-start="url(#a)" marker-end="url(#a)"/><path d="M237 104C248 104 248 104 259 80S282 32 294 80S318 139 330 80S353 65 365 80S383 81 397 80" fill="none" stroke="#bc954d" stroke-width="2"/></g>
    <text x="49" y="324" font-size="13">Amplitude (m), frequency (Hz), duration (s)</text><text x="49" y="346" font-size="12" fill="#607f94">Baseplate motion drives contacts and calibrated joints.</text>
    <g transform="translate(572 151)" stroke="#7398a7"><rect x="85" y="104" width="150" height="24" fill="#b0cbd2"/><rect x="105" y="78" width="110" height="24" fill="#91b8be"/><rect x="126" y="1" width="67" height="43" fill="#ebca86" stroke="#bb944b"/><path d="M159 49V70" fill="none" stroke="#5e7d91" stroke-width="2" marker-end="url(#a)"/><path d="M248 2V77" fill="none" stroke="#5e7d91" marker-start="url(#a)" marker-end="url(#a)"/></g>
    <text x="836" y="192" font-size="13">Release height h</text><text x="595" y="190" font-size="13">Mass m</text><text x="556" y="324" font-size="13">Nominal energy: m × g × h (joules)</text><text x="556" y="346" font-size="12" fill="#607f94">A transient fixture; the working construction is unchanged.</text>
    <text x="30" y="400" font-size="13" fill="#607f94">Report peak/final motion, rotation, broken connections, penetration, settling, and connector-calibration completeness.</text>
  </g>
</svg>
