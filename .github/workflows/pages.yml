name: Publish project website

on:
  push:
    branches: [main]
    paths:
      [
        "site/**",
        "crates/client/**",
        "crates/world/**",
        "crates/xtask/**",
        "web/favicon.svg",
        "Cargo.toml",
        "Cargo.lock",
        ".github/workflows/pages.yml",
      ]
  pull_request:
    paths:
      [
        "site/**",
        "crates/client/**",
        "crates/world/**",
        "crates/xtask/**",
        "web/favicon.svg",
        "Cargo.toml",
        "Cargo.lock",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --prefix site --ignore-scripts
      - name: Install the shared renderer toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.97.1
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: cargo test --locked -p ergo-client lighting::tests
      - run: npm run build --prefix site
      - run: npm test --prefix site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
