name: Engine and admission checks

on:
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "web/**", "scripts/**", "docs/**", ".github/workflows/engine-check.yml"]
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "web/**", "scripts/**", "docs/**", ".github/workflows/engine-check.yml"]

permissions:
  contents: read

jobs:
  catalogue-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.97.1
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: cargo xtask build-web
      - run: cargo build --locked -p ergo-server -p ergo-mcp
      - run: python3 -m pip install playwright
      - run: python3 scripts/test-web-isolated.py --script scripts/test-catalogue.py
      - run: python3 scripts/test-web-isolated.py --script scripts/test-navigation-lighting.py
      - run: python3 scripts/test-browser-cache.py
      - run: python3 scripts/test-web-isolated.py --script scripts/test-part-library-cache.py
      - run: python3 scripts/test-web-isolated.py --script scripts/test-ground-cache.py
      - run: python3 scripts/test-common-world.py
      - run: python3 scripts/test-dense-world.py
  browser-upgrade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m pip install playwright
      - run: python3 scripts/test-service-worker.py
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust and formatter
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
      - run: cargo test --workspace --locked
      - run: cargo fmt --all -- --check
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/update-common-constructs.py --check
