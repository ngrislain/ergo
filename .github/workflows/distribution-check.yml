name: Distribution checks

on:
  pull_request:
    paths:
      - .github/workflows/**
      - packages/**
      - scripts/package-mcp.py
      - scripts/test-npm-package.py
      - scripts/test-distribution.py
      - Cargo.toml
      - Cargo.lock
      - crates/mcp/**
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - packages/**
      - scripts/package-mcp.py
      - scripts/test-npm-package.py
      - scripts/test-distribution.py

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python3 scripts/package-mcp.py version
      - run: python3 scripts/test-distribution.py
      - run: node --test packages/mcp/test/*.test.cjs
