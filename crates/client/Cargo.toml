[package]
name = "ergo-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
mcp-entry = []

[dependencies]
ergo-world = {workspace = true,features=["simulation"]}
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
anyhow.workspace = true
wasm-bindgen = "0.2.129"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = {version="0.3",features=["Window","Document","Element","HtmlElement","HtmlCanvasElement","WebGl2RenderingContext","WebGlProgram","WebGlShader","WebGlBuffer","WebGlVertexArrayObject","WebGlUniformLocation","DomRect"]}
