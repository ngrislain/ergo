[package]
name = "ergo-world"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
simulation = ["dep:rapier3d-f64"]
# Install the committed reviewed-tier library fixture in dependent crates' tests.
test-library = []

[[example]]
name = "check_stability"
required-features = ["simulation"]

[dependencies]
serde.workspace = true
glam.workspace = true
anyhow.workspace = true
serde_json.workspace = true
sha2 = "0.10"
clarabel = "0.11"
rapier3d-f64 = { version = "0.26.1", optional = true, features = ["enhanced-determinism"] }

[dev-dependencies]
serde_json.workspace = true
ciborium = "0.2"
