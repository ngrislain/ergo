[package]
name = "ergo-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ergo-world = { workspace = true, features = ["simulation"] }
ergo-client.workspace = true
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
anyhow.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
ciborium = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "RequestInit", "Headers", "FocusOptions", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "HtmlDialogElement", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlVertexArrayObject", "WebGlUniformLocation", "PointerEvent", "WheelEvent", "KeyboardEvent", "DomRect", "Element", "EventTarget", "File", "FileList", "Blob", "FormData", "Navigator", "Clipboard", "Geolocation", "PositionOptions", "Position", "Coordinates", "Url", "UrlSearchParams", "HtmlAnchorElement", "Storage", "CacheStorage", "Location", "console"] }
