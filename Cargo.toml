[workspace]
members = ["crates/world", "crates/server", "crates/viewer", "crates/mcp", "crates/assets", "crates/client", "crates/xtask", "crates/transactions"]
resolver = "2"

[workspace.package]
version = "0.5.10"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
ergo-world = { path = "crates/world" }
ergo-assets = { path = "crates/assets" }
ergo-client = { path = "crates/client" }
ergo-transactions = { path = "crates/transactions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.30", features = ["serde"] }
anyhow = "1"

[profile.release]
lto = "thin"

[profile.release.package.ergo-viewer]
opt-level = "s"
